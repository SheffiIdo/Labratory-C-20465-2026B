name: Maman 14 CI (Ubuntu 24.04)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make git

      - name: Build Assembler
        run: |
          echo "=== Compiling Assembler ==="
          make clean && make
          echo "=== Build Successful ==="