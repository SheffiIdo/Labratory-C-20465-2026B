name: Maman 14 CI (Ubuntu 24.04)

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'maman14/**'
      - '.github/workflows/maman14-ci.yml'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'maman14/**'
      - '.github/workflows/maman14-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: maman14/assembler

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make git valgrind

      - name: Build Assembler
        run: |
          echo "=== Compiling Assembler ==="
          make clean
          make
          echo "=== Build Successful ==="

      - name: Test Valid Inputs (Positive Control)
        run: |
          echo "=== Testing Valid Files ==="
          
          # List all the valid files we expect to compile perfectly
          valid_files=(
            "Inputs/valid_input_1"
            "Inputs/valid_input_2"
            "Inputs/valid_input_3"
            "Inputs/valid_input_4"
            "Inputs/booklet_example"
            "Inputs/booklet_example_2"
          )
          
          for base in "${valid_files[@]}"; do
            echo "----------------------------------------"
            echo "Executing: ./assembler $base"
          
            # Valgrind crashes the CI if there is a leak OR if the program fails
            valgrind --leak-check=full --show-leak-kinds=all --error-exitcode=1 ./assembler "$base"
          
            # Verify that all 4 expected output files were successfully created
            for ext in am ob ext ent; do
              if [ ! -f "${base}.${ext}" ]; then
                echo "Error: ${base}.${ext} was not generated!"
                exit 1
              fi
            done
            echo "[V] Success: $base generated all outputs cleanly."
          done

      - name: Test Invalid Inputs (Negative Control)
        run: |
          echo "=== Testing Invalid Files ==="
          shopt -s nullglob
          invalid_files=(Inputs/invalid_input_*.as)
          
          if [ ${#invalid_files[@]} -eq 0 ]; then
            echo "No invalid files found in Inputs directory. Skipping."
            exit 0
          fi

          for file in "${invalid_files[@]}"; do
            # Strip the .as extension for a cleaner command
            base="${file%.as}"
            echo "----------------------------------------"
            echo "Testing Error Handling: ./assembler $base"
          
            # Temporarily disable GitHub's automatic crash-on-error behavior
            set +e 
          
            # Run Valgrind. If there is a LEAK, it returns 42. 
            # If there is a syntax error, it returns your normal C exit code.
            valgrind --leak-check=full --show-leak-kinds=all --error-exitcode=42 ./assembler "$base"
          
            # Capture the exact exit code Valgrind just returned
            exit_code=$? 
          
            # Re-enable GitHub's crash-on-error behavior
            set -e 
          
            # If the code is 42, we have a memory leak! Fail the CI.
            if [ $exit_code -eq 42 ]; then
              echo "Error: Memory leak detected in $base!"
              exit 1
            fi
          
            # Verify the .ob file was strictly NOT created
            if [ -f "${base}.ob" ]; then
              echo "Error: ${base}.ob was generated for an invalid file! It should have aborted."
              exit 1
            fi
          
            echo "[V] Success: $base rejected correctly with no leaks and no object file."
          done

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assembler-artifacts
          path: |
            maman14/assembler/Inputs/*
            maman14/assembler/Outputs/*